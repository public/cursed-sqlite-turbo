# ruff: pyflakes and the error-class pycodestyle rules. The style rules for one-line statements, combined imports,
# short names and late imports are off: the project's scripts are written densely on purpose (see qc/patch.py).
target-version = "py310"
line-length = 120
[lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E401", "E402", "E701", "E702", "E731", "E741"]
