[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turbo-sqlite3"
version = "0.1.0"
description = "A drop-in sqlite3 module on cursed-sqlite-turbo's SQLite (qc and qvm serve read-only statements)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND PSF-2.0 AND blessing"   # turbo (MIT), CPython's sqlite3 module (PSF), SQLite (public domain)
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Database",
]

[project.optional-dependencies]
test = ["pytest"]


[tool.pytest.ini_options]
testpaths = ["tests"]

# cibuildwheel, run from the repository root (the build needs qc/, scripts/ and the Makefile next to it):
#   cibuildwheel bindings/python --platform linux --archs x86_64
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = "*-musllinux_i686 *-manylinux_i686 *t-*"
test-requires = "pytest"
test-command = "pytest {package}/tests -q -p no:cacheprovider"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
musllinux-x86_64-image = "musllinux_1_2"
musllinux-aarch64-image = "musllinux_1_2"
before-all = "command -v unzip >/dev/null || (yum install -y unzip || dnf install -y unzip || apk add --no-cache unzip)"

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
